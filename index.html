<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b2d">
<title>BS Fresh Juices</title>
<style>
:root{--green:#183d32;--green2:#31584b;--cream:#faf9f5;--orange:#b88a50;--ink:#202820;--view-primary:#183d32;--view-secondary:#e8eee9;--view-accent:#b88a50;--view-bg:#faf9f5}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
header{background:var(--green);color:white;padding:22px 18px 42px;text-align:center}
.top{display:flex;justify-content:flex-end;max-width:1050px;margin:auto}
button{font:inherit;cursor:pointer}.lang,.back{background:transparent;color:white;border:1px solid #ffffff80;border-radius:24px;padding:8px 14px}
.brand{font-size:clamp(28px,6vw,48px);font-weight:800;letter-spacing:2px;margin:22px 0 8px}
.tag{color:#e8eee9;margin:0;font-size:14px;letter-spacing:1.5px}
main{max-width:1050px;margin:-22px auto 0;padding:0 16px 55px}
.intro{text-align:center;margin:0 auto 25px;max-width:650px}
.intro h1{font-size:25px;margin:0 0 8px;color:var(--green)}
.intro p{margin:0;color:#66736b;line-height:1.6}
.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
.category{background:white;border:1px solid #e5e9e2;border-radius:16px;padding:22px;text-align:center;color:var(--green);font-weight:700;font-size:18px;box-shadow:0 8px 25px #173d250b}
.category:active{transform:scale(.99)}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.product{background:var(--view-secondary);border:1px solid color-mix(in srgb,var(--view-primary) 14%,white);border-radius:16px;overflow:hidden;box-shadow:0 8px 25px #173d250b}
.product img{width:100%;height:190px;object-fit:cover;background:var(--view-bg);display:block}
.product .info{padding:15px}.product h3{margin:0 0 7px;color:var(--view-primary);font-size:18px}
.product p{margin:0;color:#68746c;line-height:1.5;font-size:14px;white-space:pre-wrap}
.price{margin-top:12px;color:var(--view-accent);font-size:18px;font-weight:800}
body.category-open{background:var(--view-bg)}
body.category-open header{background:var(--view-primary)}
body.category-open .intro h1{color:var(--view-primary)}
body.category-open .product .info{background:var(--view-secondary)}
body.category-open .product p{color:color-mix(in srgb,var(--view-primary) 70%,#777)}
.notice{background:white;border:1px solid #e5e9e2;border-radius:16px;padding:30px 18px;text-align:center;color:#68746c;line-height:1.6}
.back{display:block;margin:0 auto 18px;background:var(--green);border:0}
footer{text-align:center;color:#7a857d;font-size:12px;padding:20px}
[dir=rtl] body{text-align:right}[dir=rtl] .top{justify-content:flex-start}
@media(max-width:480px){.category-grid{grid-template-columns:1fr 1fr;gap:10px}.category{padding:18px 10px;font-size:16px}.product img{height:170px}}
</style>
</head>
<body>
<header>
 <div class="top"><button class="lang" id="language" type="button">العربية</button></div>
 <img id="brandLogo" alt="BS Fresh Juices logo" hidden style="display:none;max-width:150px;max-height:90px;object-fit:contain;margin:18px auto 8px"><div class="brand" id="brand">BS FRESH JUICES</div>
 <p class="tag" id="tagline">FRESHNESS IN EVERY SIP</p>
</header>
<main>
 <section class="intro"><h1 id="heading">Our Menu</h1><p id="description">Freshly prepared with care.</p></section>
 <button id="back" class="back" hidden type="button">← Back to categories</button>
 <section id="content" aria-live="polite"><div class="notice">Loading menu…</div></section>
</main>
<footer>© <span id="year"></span> <span id="footerBrand">BS Fresh Juices</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const $=id=>document.getElementById(id);
const words={
 en:{switch:"العربية",heading:"Our Menu",description:"Freshly prepared with care.",back:"← Back to categories",empty:"Our menu is being prepared. Please check back soon.",error:"We couldn't load the menu right now. Please try again later."},
 ar:{switch:"English",heading:"قائمتنا",description:"نحضّر كل شيء بعناية وطزاجة.",back:"العودة إلى الأقسام →",empty:"قائمتنا قيد التجهيز. زورونا قريباً.",error:"تعذّر تحميل القائمة حالياً. حاولوا مرة أخرى لاحقاً."}
};
let lang="en",client=null,allProducts=[],currentCategory=null,cats=[];
function tr(en,ar){return lang==="ar"?(ar||en):(en||ar);}
function publicImage(path){
 if(!path||!client)return "";
 return client.storage.from("menu-images").getPublicUrl(path).data.publicUrl;
}
function renderCategories(){
 currentCategory=null;document.body.classList.remove("category-open");$("back").hidden=true;
 $("heading").textContent=words[lang].heading;
 const visible=cats;
 if(!visible.length){$("content").innerHTML='<div class="notice">'+words[lang].empty+'</div>';return;}
 $("content").innerHTML='<div class="category-grid">'+visible.map(c=>'<button class="category" type="button" data-cat="'+c.id+'">'+escapeHtml(tr(c.name_en,c.name_ar))+'</button>').join("")+'</div>';
 document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>renderProducts(b.dataset.cat)));
}
function renderProducts(id){
 currentCategory=id;const cat=cats.find(c=>c.id===id);document.body.classList.add("category-open");
 const validColor=(v,f)=>/^#[0-9a-fA-F]{6}$/.test(v||"")?v:f;
 document.documentElement.style.setProperty("--view-primary",validColor(cat?.theme_primary,"#183d32"));
 document.documentElement.style.setProperty("--view-secondary",validColor(cat?.theme_secondary,"#e8eee9"));
 document.documentElement.style.setProperty("--view-accent",validColor(cat?.theme_accent,"#b88a50"));
 document.documentElement.style.setProperty("--view-bg",validColor(cat?.theme_background,"#faf9f5"));
 $("back").hidden=false;
 $("heading").textContent=tr(cat?.name_en,cat?.name_ar)||words[lang].heading;
 const items=allProducts.filter(p=>p.category_id===id);
 if(!items.length){$("content").innerHTML='<div class="notice">'+words[lang].empty+'</div>';return;}
 $("content").innerHTML='<div class="products">'+items.map(p=>{
 const image=publicImage(p.image_path);
 return '<article class="product">'+(image?'<img loading="lazy" src="'+escapeAttr(image)+'" alt="'+escapeAttr(tr(p.name_en,p.name_ar))+'">':'')+
 '<div class="info"><h3>'+escapeHtml(tr(p.name_en,p.name_ar))+'</h3>'+
 ((tr(p.description_en,p.description_ar))?'<p>'+escapeHtml(tr(p.description_en,p.description_ar))+'</p>':'')+
 (p.price!==null&&p.price!==undefined?'<div class="price">'+escapeHtml(String(p.price))+'</div>':'')+
 '</div></article>';
 }).join("")+'</div>';
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(v){return escapeHtml(v);}
function applyLanguage(){
 const t=words[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("language").textContent=t.switch;$("description").textContent=t.description;$("back").textContent=t.back;
 if(currentCategory)renderProducts(currentCategory);else renderCategories();
}
$("language").addEventListener("click",()=>{lang=lang==="en"?"ar":"en";applyLanguage();});
$("back").addEventListener("click",renderCategories);
$("year").textContent=new Date().getFullYear();
async function start(){
 if(!window.supabase||!window.BS_SUPABASE_URL||!window.BS_SUPABASE_ANON_KEY){$("content").innerHTML='<div class="notice">'+words[lang].error+'</div>';return;}
 client=window.supabase.createClient(window.BS_SUPABASE_URL,window.BS_SUPABASE_ANON_KEY);
 try{
  const [settings,categories,products]=await Promise.all([
   client.from("site_settings").select("*").eq("id",1).maybeSingle(),
   client.from("categories").select("*").eq("is_active",true).order("sort_order").order("created_at"),
   client.from("products").select("*").eq("is_active",true).order("sort_order").order("created_at")
  ]);
  if(settings.error)throw settings.error;if(categories.error)throw categories.error;if(products.error)throw products.error;
  if(settings.data){const s=settings.data;$("brand").textContent=s.brand_name||"BS FRESH JUICES";if(s.logo_path){$("brandLogo").src=publicImage(s.logo_path);$("brandLogo").hidden=false;$("brandLogo").style.display="block";$("brand").style.display="none";}else{$("brandLogo").hidden=true;$("brandLogo").style.display="none";$("brand").style.display="block";}$("footerBrand").textContent=s.brand_name||"BS Fresh Juices";$("tagline").textContent=tr(s.tagline_en,s.tagline_ar)||words[lang].description;/* Homepage colours stay intentionally calm and premium; category pages use their own saved themes. */}
  cats=categories.data||[];allProducts=products.data||[];applyLanguage();
 }catch(err){console.error(err);$("content").innerHTML='<div class="notice">'+words[lang].error+'</div>';}
}
start();
</script>
</body>
</html>
